name: Release Desktop Relay

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload assets to"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            script: dist:win
            artifacts: |
              desktop-relay/release/*.exe
              desktop-relay/release/*.blockmap
          - name: macos-x64
            os: macos-13
            script: dist:mac:x64
            artifacts: |
              desktop-relay/release/*.dmg
              desktop-relay/release/*.zip
              desktop-relay/release/*.blockmap
          - name: macos-arm64
            os: macos-13
            script: dist:mac:arm64
            artifacts: |
              desktop-relay/release/*.dmg
              desktop-relay/release/*.zip
              desktop-relay/release/*.blockmap
          - name: linux-x64
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              desktop-relay/release/*.AppImage
              desktop-relay/release/*.deb
              desktop-relay/release/*.blockmap

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent-relay/package-lock.json
            desktop-relay/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-relay

      - name: Build desktop relay
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}
        working-directory: desktop-relay

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-relay-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-relay-*
          merge-multiple: true

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "EasyCodex ${TAG_NAME#v}" --notes-file CHANGELOG.md
          find release-assets -maxdepth 1 -type f -print0 | sort -z | xargs -0 gh release upload "$TAG_NAME" --clobber

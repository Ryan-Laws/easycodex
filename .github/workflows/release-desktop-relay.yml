name: Release Desktop Relay

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-desktop-relay-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            script: dist:win
            artifacts: |
              desktop-relay/release/*.exe
              desktop-relay/release/*.blockmap
          - name: macos-x64
            os: macos-15-intel
            script: dist:mac:x64
            artifacts: |
              desktop-relay/release/*.dmg
              desktop-relay/release/*.zip
              desktop-relay/release/*.blockmap
          - name: macos-arm64
            os: macos-15
            script: dist:mac:arm64
            artifacts: |
              desktop-relay/release/*.dmg
              desktop-relay/release/*.zip
              desktop-relay/release/*.blockmap
          - name: linux-x64
            os: ubuntu-latest
            script: dist:linux
            artifacts: |
              desktop-relay/release/*.AppImage
              desktop-relay/release/*.deb
              desktop-relay/release/*.blockmap

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent-relay/package-lock.json
            desktop-relay/package-lock.json

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          desktop_version="$(node -p "require('./desktop-relay/package.json').version")"
          relay_version="$(node -p "require('./agent-relay/package.json').version")"
          root_version="$(node -p "require('./package.json').version")"
          if [[ "$version" != "$desktop_version" || "$version" != "$relay_version" || "$version" != "$root_version" ]]; then
            echo "Tag version $version must match package versions: root=$root_version agent-relay=$relay_version desktop-relay=$desktop_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-relay

      - name: Build desktop relay
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}
        working-directory: desktop-relay

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-relay-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          notes_file="$RUNNER_TEMP/easycodex-release-notes.md"
          node scripts/extract-release-notes.mjs "${{ steps.release.outputs.version }}" > "$notes_file"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "EasyCodex ${{ steps.release.outputs.version }}" --notes-file "$notes_file" || gh release view "$tag" >/dev/null
          find desktop-relay/release -maxdepth 1 -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.blockmap' \) -print0 | sort -z | xargs -0 gh release upload "$tag"

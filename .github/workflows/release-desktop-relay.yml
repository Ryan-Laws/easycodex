name: Release Desktop Relay

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            script: dist:win
            artifacts: |
              desktop-relay/release/*.exe
              desktop-relay/release/*.blockmap
          - name: macOS
            os: macos-latest
            script: dist:mac
            artifacts: |
              desktop-relay/release/*.dmg
              desktop-relay/release/*.zip
              desktop-relay/release/*.blockmap

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            agent-relay/package-lock.json
            desktop-relay/package-lock.json

      - name: Install desktop dependencies
        run: npm ci
        working-directory: desktop-relay

      - name: Build desktop relay
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }}
        working-directory: desktop-relay

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-relay-${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file CHANGELOG.md
          while IFS= read -r artifact; do
            [ -n "$artifact" ] || continue
            gh release upload "$TAG_NAME" "$artifact" --clobber
          done < <(find desktop-relay/release -maxdepth 1 \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' \) -type f)

name: Release Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish, for example v0.1.1"
        required: true
      upload:
        description: "Upload the signed APK to the GitHub release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-android-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-sign-smoke-publish:
    name: Build, sign, smoke, publish Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ github.event.inputs.release_tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          version="${tag#v}"
          gradle_version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' mobile/app/build.gradle.kts | head -n 1)"
          root_version="$(node -p "require('./package.json').version")"
          relay_version="$(node -p "require('./agent-relay/package.json').version")"
          desktop_version="$(node -p "require('./desktop-relay/package.json').version")"
          if [[ "$version" != "$gradle_version" || "$version" != "$root_version" || "$version" != "$relay_version" || "$version" != "$desktop_version" ]]; then
            echo "Tag version $version must match Android and package versions: android=$gradle_version root=$root_version agent-relay=$relay_version desktop-relay=$desktop_version" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Allow Gradle wrapper execution
        run: chmod +x gradlew
        working-directory: mobile

      - name: Build Android release APK
        run: ./gradlew assembleRelease :app:lintVitalRelease
        working-directory: mobile

      - name: Restore Android signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/easycodex-release.keystore"

      - name: Sign Android release APK
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing $name secret" >&2
              exit 1
            fi
          done
          key_password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          unsigned="mobile/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="mobile/app/build/outputs/apk/release/EasyCodex.Mobile.${{ steps.release.outputs.version }}-aligned.apk"
          signed="mobile/app/build/outputs/apk/release/EasyCodex.Mobile.${{ steps.release.outputs.version }}.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/easycodex-release.keystore" \
            --ks-key-alias "$ANDROID_KEYSTORE_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$key_password" \
            --out "$signed" \
            "$aligned"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$signed" > "$RUNNER_TEMP/apksigner.txt"
          cert_sha="$(sed -n 's/^.*certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          expected_sha="$(printf '%s' "$ANDROID_SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [[ "$cert_sha" != "$expected_sha" ]]; then
            echo "Android signing certificate mismatch" >&2
            echo "Expected: $expected_sha" >&2
            echo "Actual:   $cert_sha" >&2
            exit 1
          fi
          echo "apk=$signed" >> "$GITHUB_OUTPUT"
          sha256sum "$signed" | tee "$signed.sha256"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch signed release APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 15
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            adb install -r "${{ steps.sign.outputs.apk }}"
            adb logcat -c
            adb shell am start -W -n com.easycodex.mobile/.MainActivity
            sleep 8
            adb shell pidof com.easycodex.mobile
            adb logcat -d -v time > "$RUNNER_TEMP/easycodex-release-logcat.txt"
            ! grep -E "FATAL EXCEPTION|AndroidRuntime|VerifyError|Force finishing activity com.easycodex.mobile" "$RUNNER_TEMP/easycodex-release-logcat.txt"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ steps.release.outputs.version }}
          path: |
            ${{ steps.sign.outputs.apk }}
            ${{ steps.sign.outputs.apk }}.sha256
          if-no-files-found: error

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.upload == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "EasyCodex ${{ steps.release.outputs.version }}" --notes-file CHANGELOG.md
          gh release upload "$tag" "${{ steps.sign.outputs.apk }}" "${{ steps.sign.outputs.apk }}.sha256" --clobber
